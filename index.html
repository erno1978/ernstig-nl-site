:root{--bg:#ff7a1a}
:root.com{--bg:#0f9b6e}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  min-height:100svh;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
/* De stage bepaalt de schaal: alles erbinnen is in cqi (procent van deze breedte) */
.stage{width:min(94vw,133svh,820px);container-type:inline-size;display:flex;justify-content:center}
.sticker{
  position:relative;
  isolation:isolate;
  transform:rotate(-3deg);
  padding:3.2cqi 4.6cqi 3.6cqi 4.2cqi;
}
/* Handgetekende stickervorm: schaduw + wit vlak met inktrand */
.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:-1}
.shape .shadow{fill:#1b1f2a;transform:translate(2.2px,3.4px)}
.shape .face{fill:#ffffff;stroke:#1b1f2a;stroke-width:.8cqi;stroke-linejoin:miter;stroke-miterlimit:2;vector-effect:non-scaling-stroke}
.logo{display:flex;align-items:center;gap:2cqi;font-family:'Erno2024','Comic Sans MS',cursive;line-height:1.1;color:#1b1f2a}
.stem{font-size:12cqi}
.brace{width:3.2cqi;height:16cqi;flex:none}
.brace path{fill:none;stroke:#1b1f2a;stroke-width:3.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.tlds{display:flex;flex-direction:column;gap:.6cqi;font-size:6.5cqi}
.tlds a{text-decoration:none;border-radius:.6cqi}
.tlds a:hover{text-decoration:underline;text-underline-offset:.12em;text-decoration-thickness:.06em}
.tlds a:focus-visible{outline:.4cqi solid currentColor;outline-offset:.6cqi}
.nl{color:#d9480f}.com{color:#0f9b6e}
</style>
</head>
